[package]
name = "cdisklinker"
version = "1.5.1"
edition = "2021"
authors = ["Antigravity"]
description = "A lightweight Windows tool to release C drive space by creating Directory Junctions safely."

[lib]
name = "cdisklinker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security"
] }
widestring = "1.0"
sha2 = "0.10"
chrono = "0.4"
encoding_rs = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
