name: release

# 触发条件：推送 v* 格式 tag 时自动构建并发布；同时支持手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名密钥：用于生成 .sig 签名文件，配合 latest.json 实现自动更新
          # 私钥与密码需在仓库 Settings → Secrets and variables → Actions 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CDiskLinker ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          # tauri-action 会自动上传 latest.json 与 .sig 文件到 Release 资产
          args: --target x86_64-pc-windows-msvc
