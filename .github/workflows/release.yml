name: release

# 触发条件：推送 v* 格式 tag 时自动构建并发布；同时支持手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # 从 tag 指向 commit 的 message 提取 release notes（首行 + body）
      # 作为 GitHub Release body，进而写入 latest.json 的 notes 字段供客户端显示
      - name: Extract release notes from commit
        id: release_notes
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B ${{ github.sha }})
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名密钥：用于生成 .sig 签名文件，配合 latest.json 实现自动更新
          # 私钥与密码需在仓库 Settings → Secrets and variables → Actions 中配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CDiskLinker ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # tauri-action 会自动上传 latest.json 与 .sig 文件到 Release 资产
          args: --target x86_64-pc-windows-msvc

      # 上传固定资产名资产，供官网 /releases/latest/download/ 直下载使用
      - name: Upload fixed-name asset for latest download
        run: |
          $setup = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup.exe not found" }
          Copy-Item $setup.FullName "CDiskLinker-Setup.exe"
          gh release upload ${{ github.ref_name }} "CDiskLinker-Setup.exe" --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
